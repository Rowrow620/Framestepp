name: Playground

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - cmake/**
      - include/**
      - src/**
      - examples/**
      - webplayground/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webplayground/package-lock.json

      - name: Build WebAssembly compiler
        shell: bash
        run: |
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "5eb0bde7585670252e8ba05e9d361627bffd08b5"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake \
            -S webplayground/wasm \
            -B build/webplayground-wasm \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DFRAMESTEPP_WARNINGS_AS_ERRORS=ON
          cmake --build build/webplayground-wasm --target framestepp_web --parallel

      - name: Install playground dependencies
        working-directory: webplayground
        run: npm ci

      - name: Verify playground
        working-directory: webplayground
        run: npm run verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload playground
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: webplayground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
